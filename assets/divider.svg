<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 12" width="100%" height="12">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090D16" stop-opacity="0" />
      <stop offset="20%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="80%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0" />
    </linearGradient>
  </defs>
  <line x1="0" y1="6" x2="1200" y2="6" stroke="#1E293B" stroke-width="1" stroke-opacity="0.5" />
  <rect x="-250" y="5" width="250" height="2" fill="url(#lineGrad)">
    <animate attributeName="x" from="-250" to="1200" dur="3.5s" repeatCount="indefinite" />
  </rect>
</svg>
