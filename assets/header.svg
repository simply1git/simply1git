<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <radialGradient id="glow1" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow2" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.6" />
    </pattern>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font: 800 52px 'JetBrains Mono', 'Fira Code', monospace; fill: #F8FAFC; letter-spacing: -1.5px; }
    .subtitle { font: 600 17px 'JetBrains Mono', 'Fira Code', monospace; fill: url(#accent); letter-spacing: 3px; }
    .meta { font: 500 13px 'JetBrains Mono', monospace; fill: #64748B; letter-spacing: 1.5px; }
    .badge-text { font: 600 12px 'JetBrains Mono', monospace; fill: #00F0FF; letter-spacing: 1px; }
    .pulse { animation: pulseAnim 2.2s infinite ease-in-out; }
    @keyframes pulseAnim {
      0%, 100% { opacity: 1; r: 5px; }
      50% { opacity: 0.35; r: 7px; }
    }
  </style>

  <rect width="1200" height="320" rx="16" fill="url(#bg)" />
  <rect width="1200" height="320" rx="16" fill="url(#grid)" />
  <rect width="1200" height="320" rx="16" fill="url(#glow1)" />
  <rect width="1200" height="320" rx="16" fill="url(#glow2)" />
  <rect x="1" y="1" width="1198" height="318" rx="15" fill="none" stroke="#1E293B" stroke-width="1.5" />

  <path d="M 0 265 L 280 265 L 310 290 L 890 290 L 920 265 L 1200 265" fill="none" stroke="#1E293B" stroke-width="1.5" />
  <path d="M 0 265 L 280 265 L 310 290 L 890 290 L 920 265 L 1200 265" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="180 1200">
    <animate attributeName="stroke-dashoffset" from="1380" to="0" dur="4.5s" repeatCount="indefinite" />
  </path>

  <rect x="70" y="42" width="295" height="28" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
  <circle cx="90" cy="56" r="5" fill="#00F0FF" class="pulse" filter="url(#neonGlow)" />
  <text x="108" y="60" class="badge-text">SYS.ONLINE // SIMPLY1GIT</text>

  <text x="70" y="142" class="title">SAMARTHA H M</text>
  <text x="72" y="182" class="subtitle">FULL-STACK ARCHITECT · AI SYSTEMS · EMBEDDED & IOT</text>
  <text x="72" y="222" class="meta">SILICON-TO-CLOUD ENGINEERING  //  HIGH-THROUGHPUT DISTRIBUTED SYSTEMS  //  EDGE AI</text>

  <g transform="translate(980, 75)" opacity="0.85">
    <circle cx="80" cy="80" r="68" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="6 6" />
    <circle cx="80" cy="80" r="52" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="90 240">
      <animateTransform attributeName="transform" type="rotate" from="0 80 80" to="360 80 80" dur="10s" repeatCount="indefinite" />
    </circle>
    <circle cx="80" cy="80" r="34" fill="none" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="50 180">
      <animateTransform attributeName="transform" type="rotate" from="360 80 80" to="0 80 80" dur="7s" repeatCount="indefinite" />
    </circle>
    <text x="80" y="85" text-anchor="middle" class="badge-text"></></text>
  </g>
</svg>