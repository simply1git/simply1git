<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Outfit:wght@300;600;800&amp;display=swap');

      /* ═══ BASE ═══ */
      .bg { fill: #0a0e17; }
      .frame { fill: none; stroke: #1a1f2e; stroke-width: 1; }

      /* ═══ GRID PATTERN ═══ */
      .grid-line { stroke: #0f1520; stroke-width: 0.5; opacity: 0.6; }
      .grid-dot { fill: #1a2332; r: 1; }

      /* ═══ GLOWING ORBS ═══ */
      .orb1 { fill: #00f2fe; opacity: 0; animation: orb-float1 8s ease-in-out infinite; }
      .orb2 { fill: #7c3aed; opacity: 0; animation: orb-float2 10s ease-in-out infinite 2s; }
      .orb3 { fill: #f472b6; opacity: 0; animation: orb-float3 12s ease-in-out infinite 4s; }
      .orb4 { fill: #34d399; opacity: 0; animation: orb-float4 9s ease-in-out infinite 1s; }

      @keyframes orb-float1 {
        0%,100% { opacity: 0; transform: translate(0,0); }
        20% { opacity: 0.15; }
        50% { opacity: 0.08; transform: translate(30px, -20px); }
        80% { opacity: 0.15; }
      }
      @keyframes orb-float2 {
        0%,100% { opacity: 0; transform: translate(0,0); }
        30% { opacity: 0.12; }
        60% { opacity: 0.06; transform: translate(-25px, 15px); }
        85% { opacity: 0.12; }
      }
      @keyframes orb-float3 {
        0%,100% { opacity: 0; transform: translate(0,0); }
        25% { opacity: 0.1; }
        55% { opacity: 0.05; transform: translate(20px, 25px); }
        75% { opacity: 0.1; }
      }
      @keyframes orb-float4 {
        0%,100% { opacity: 0; transform: translate(0,0); }
        35% { opacity: 0.13; }
        65% { opacity: 0.07; transform: translate(-15px, -30px); }
        90% { opacity: 0.13; }
      }

      /* ═══ SCANLINE ═══ */
      .scanline {
        fill: url(#scanGrad);
        opacity: 0.03;
        animation: scan 6s linear infinite;
      }
      @keyframes scan {
        0% { transform: translateY(-40px); }
        100% { transform: translateY(360px); }
      }

      /* ═══ NAME TEXT ═══ */
      .name {
        font-family: 'Outfit', sans-serif;
        font-weight: 800;
        font-size: 52px;
        fill: #e2e8f0;
        opacity: 0;
        animation: name-reveal 1.5s ease-out 0.5s forwards;
      }
      .name-glow {
        font-family: 'Outfit', sans-serif;
        font-weight: 800;
        font-size: 52px;
        fill: none;
        stroke: #00f2fe;
        stroke-width: 0.5;
        opacity: 0;
        animation: glow-pulse 3s ease-in-out 1.5s infinite;
      }
      @keyframes name-reveal {
        0% { opacity: 0; transform: translateY(15px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes glow-pulse {
        0%,100% { opacity: 0; stroke-width: 0.5; }
        50% { opacity: 0.4; stroke-width: 1.5; }
      }

      /* ═══ SUBTITLE ═══ */
      .subtitle {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        fill: #64748b;
        opacity: 0;
        animation: fade-up 1s ease-out 1.2s forwards;
      }
      .subtitle-accent {
        fill: #00f2fe;
      }
      @keyframes fade-up {
        0% { opacity: 0; transform: translateY(10px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      /* ═══ STATUS PILLS ═══ */
      .pill-bg {
        rx: 12; ry: 12;
        fill: #0f1520;
        stroke: #1e293b;
        stroke-width: 1;
        opacity: 0;
        animation: pill-in 0.6s ease-out forwards;
      }
      .pill1 { animation-delay: 1.8s; }
      .pill2 { animation-delay: 2.0s; }
      .pill3 { animation-delay: 2.2s; }
      .pill-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        fill: #94a3b8;
        opacity: 0;
        animation: pill-in 0.6s ease-out forwards;
      }
      .pill-dot {
        opacity: 0;
        animation: pill-in 0.6s ease-out forwards, dot-blink 2s ease-in-out infinite 3s;
      }
      .dot-green { fill: #34d399; }
      .dot-cyan { fill: #00f2fe; }
      .dot-purple { fill: #a78bfa; }

      @keyframes pill-in {
        0% { opacity: 0; transform: translateY(8px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes dot-blink {
        0%,100% { opacity: 1; }
        50% { opacity: 0.4; }
      }

      /* ═══ TERMINAL PROMPT ═══ */
      .prompt {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        opacity: 0;
        animation: fade-up 0.8s ease-out 2.5s forwards;
      }
      .prompt-user { fill: #34d399; }
      .prompt-at { fill: #475569; }
      .prompt-host { fill: #a78bfa; }
      .prompt-path { fill: #00f2fe; }
      .prompt-cmd { fill: #e2e8f0; }
      .cursor {
        fill: #e2e8f0;
        opacity: 0;
        animation: fade-up 0.1s ease-out 2.5s forwards, blink 1s step-end infinite 2.5s;
      }
      @keyframes blink {
        0%,100% { opacity: 1; }
        50% { opacity: 0; }
      }

      /* ═══ DECORATIVE LINES ═══ */
      .deco-line {
        stroke: #1a2332;
        stroke-width: 1;
        opacity: 0;
        animation: line-draw 1.5s ease-out forwards;
      }
      .dl1 { animation-delay: 0.3s; stroke: #00f2fe; opacity: 0; }
      .dl2 { animation-delay: 0.6s; }
      .dl3 { animation-delay: 0.8s; stroke: #7c3aed; }

      @keyframes line-draw {
        0% { opacity: 0; stroke-dasharray: 200; stroke-dashoffset: 200; }
        100% { opacity: 0.3; stroke-dasharray: 200; stroke-dashoffset: 0; }
      }

      /* ═══ CORNER BRACKETS ═══ */
      .corner {
        stroke: #1e293b;
        stroke-width: 1.5;
        fill: none;
        opacity: 0;
        animation: corner-in 0.8s ease-out 0.2s forwards;
      }
      .corner-accent {
        stroke: #00f2fe;
        stroke-width: 1;
        fill: none;
        opacity: 0;
        animation: corner-in 0.8s ease-out 0.4s forwards;
      }
      @keyframes corner-in {
        0% { opacity: 0; }
        100% { opacity: 0.5; }
      }

      /* ═══ FLOATING PARTICLES ═══ */
      .particle {
        fill: #00f2fe;
        opacity: 0;
      }
      .p1 { animation: float-p 7s ease-in-out infinite 0s; }
      .p2 { animation: float-p 9s ease-in-out infinite 1.5s; }
      .p3 { animation: float-p 8s ease-in-out infinite 3s; }
      .p4 { animation: float-p 11s ease-in-out infinite 2s; }
      .p5 { animation: float-p 6s ease-in-out infinite 4s; fill: #7c3aed; }
      .p6 { animation: float-p 10s ease-in-out infinite 0.5s; fill: #f472b6; }
      .p7 { animation: float-p 7.5s ease-in-out infinite 3.5s; fill: #34d399; }

      @keyframes float-p {
        0%,100% { opacity: 0; transform: translateY(0); }
        10% { opacity: 0.6; }
        50% { opacity: 0.3; transform: translateY(-40px); }
        90% { opacity: 0.6; }
      }

      /* ═══ HEX CODE DECORATIONS ═══ */
      .hex-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 9px;
        fill: #1e293b;
        opacity: 0;
        animation: hex-fade 4s ease-in-out infinite;
      }
      .h1 { animation-delay: 0s; }
      .h2 { animation-delay: 2s; }
      .h3 { animation-delay: 1s; }
      .h4 { animation-delay: 3s; }

      @keyframes hex-fade {
        0%,100% { opacity: 0; }
        50% { opacity: 0.3; }
      }
    </style>

    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="orbGrad1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbGrad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbGrad3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ═══ BACKGROUND ═══ -->
  <rect class="bg" width="900" height="320" rx="0"/>

  <!-- ═══ SUBTLE GRID ═══ -->
  <line class="grid-line" x1="0" y1="40" x2="900" y2="40"/>
  <line class="grid-line" x1="0" y1="80" x2="900" y2="80"/>
  <line class="grid-line" x1="0" y1="120" x2="900" y2="120"/>
  <line class="grid-line" x1="0" y1="160" x2="900" y2="160"/>
  <line class="grid-line" x1="0" y1="200" x2="900" y2="200"/>
  <line class="grid-line" x1="0" y1="240" x2="900" y2="240"/>
  <line class="grid-line" x1="0" y1="280" x2="900" y2="280"/>
  <line class="grid-line" x1="150" y1="0" x2="150" y2="320"/>
  <line class="grid-line" x1="300" y1="0" x2="300" y2="320"/>
  <line class="grid-line" x1="450" y1="0" x2="450" y2="320"/>
  <line class="grid-line" x1="600" y1="0" x2="600" y2="320"/>
  <line class="grid-line" x1="750" y1="0" x2="750" y2="320"/>

  <!-- ═══ AMBIENT ORBS ═══ -->
  <circle class="orb1" cx="150" cy="100" r="120" fill="url(#orbGrad1)"/>
  <circle class="orb2" cx="700" cy="200" r="100" fill="url(#orbGrad2)"/>
  <circle class="orb3" cx="800" cy="80" r="80" fill="url(#orbGrad3)"/>
  <circle class="orb4" cx="350" cy="250" r="90" fill="url(#orbGrad1)"/>

  <!-- ═══ SCANLINE ═══ -->
  <rect class="scanline" x="0" y="0" width="900" height="4"/>

  <!-- ═══ CORNER BRACKETS ═══ -->
  <polyline class="corner" points="2,30 2,2 30,2"/>
  <polyline class="corner" points="870,2 898,2 898,30"/>
  <polyline class="corner" points="898,290 898,318 870,318"/>
  <polyline class="corner" points="30,318 2,318 2,290"/>

  <polyline class="corner-accent" points="8,24 8,8 24,8"/>
  <polyline class="corner-accent" points="876,8 892,8 892,24"/>
  <polyline class="corner-accent" points="892,296 892,312 876,312"/>
  <polyline class="corner-accent" points="24,312 8,312 8,296"/>

  <!-- ═══ DECORATIVE LINES ═══ -->
  <line class="deco-line dl1" x1="40" y1="2" x2="180" y2="2"/>
  <line class="deco-line dl2" x1="720" y1="318" x2="860" y2="318"/>
  <line class="deco-line dl3" x1="898" y1="40" x2="898" y2="140"/>

  <!-- ═══ HEX DECORATIONS ═══ -->
  <text class="hex-text h1" x="40" y="315">0x53 0x48 0x4D</text>
  <text class="hex-text h2" x="770" y="15">SYS::ONLINE</text>
  <text class="hex-text h3" x="40" y="15">REV::2025.09</text>
  <text class="hex-text h4" x="730" y="315">NODE::ACTIVE</text>

  <!-- ═══ FLOATING PARTICLES ═══ -->
  <circle class="particle p1" cx="120" cy="180" r="1.5"/>
  <circle class="particle p2" cx="380" cy="60" r="1"/>
  <circle class="particle p3" cx="650" cy="140" r="1.5"/>
  <circle class="particle p4" cx="820" cy="260" r="1"/>
  <circle class="particle p5" cx="250" cy="280" r="2"/>
  <circle class="particle p6" cx="550" cy="50" r="1"/>
  <circle class="particle p7" cx="750" cy="180" r="1.5"/>

  <!-- ═══ MAIN NAME ═══ -->
  <text class="name" x="450" y="120" text-anchor="middle">SAMARTHA H M</text>
  <text class="name-glow" x="450" y="120" text-anchor="middle">SAMARTHA H M</text>

  <!-- ═══ ROLE SUBTITLE ═══ -->
  <text class="subtitle" x="450" y="155" text-anchor="middle">
    <tspan class="subtitle-accent">»</tspan>  software architect  <tspan class="subtitle-accent">·</tspan>  ai systems engineer  <tspan class="subtitle-accent">·</tspan>  open source craftsman  <tspan class="subtitle-accent">«</tspan>
  </text>

  <!-- ═══ STATUS PILLS ═══ -->
  <g>
    <rect class="pill-bg pill1" x="210" y="180" width="140" height="28"/>
    <circle class="pill-dot dot-green pill1" cx="228" cy="194" r="3.5"/>
    <text class="pill-text pill1" x="240" y="198">OPEN TO WORK</text>
  </g>
  <g>
    <rect class="pill-bg pill2" x="365" y="180" width="170" height="28"/>
    <circle class="pill-dot dot-cyan pill2" cx="383" cy="194" r="3.5"/>
    <text class="pill-text pill2" x="395" y="198">BUILDING IN PUBLIC</text>
  </g>
  <g>
    <rect class="pill-bg pill3" x="550" y="180" width="140" height="28"/>
    <circle class="pill-dot dot-purple pill3" cx="568" cy="194" r="3.5"/>
    <text class="pill-text pill3" x="580" y="198">29+ SHIPPED</text>
  </g>

  <!-- ═══ TERMINAL PROMPT ═══ -->
  <text class="prompt" x="200" y="255">
    <tspan class="prompt-user">samartha</tspan><tspan class="prompt-at">@</tspan><tspan class="prompt-host">github</tspan>
    <tspan class="prompt-path"> ~/projects </tspan>
    <tspan class="prompt-at">$</tspan>
    <tspan class="prompt-cmd"> echo "let's build something incredible"</tspan>
  </text>
  <rect class="cursor" x="756" y="244" width="8" height="15" rx="1"/>

  <!-- ═══ BORDER FRAME ═══ -->
  <rect class="frame" x="0.5" y="0.5" width="899" height="319" rx="0"/>
</svg>
